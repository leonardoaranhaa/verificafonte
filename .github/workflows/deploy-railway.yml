name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'leonardoaranhaa/verificafonte'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.Railway_secret }}
          RAILWAY_SERVICE: ${{ secrets.Railway_id }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Secret Railway_secret ausente."
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Secret Railway_id ausente (nome ou ID do serviço do app)."
            exit 1
          fi
          echo "Service: $RAILWAY_SERVICE"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.Railway_secret }}
        run: railway up --detach --service "${{ secrets.Railway_id }}"

      - name: Summary
        run: |
          echo "### Deploy enviado à Railway" >> "$GITHUB_STEP_SUMMARY"
          echo "Service: \`${{ secrets.Railway_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
