name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'leonardoaranhaa/verificafonte'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.Railway_secret }}
          # Aceita vários nomes comuns
          S1: ${{ secrets.RAILWAY_SERVICE_ID }}
          S2: ${{ secrets.Railway_service_id }}
          S3: ${{ secrets.Railway_service }}
          S4: ${{ secrets.RAILWAY_SERVICE }}
          S5: ${{ secrets.service_id }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret Railway_secret ausente."
            exit 1
          fi
          SVC="$S1"
          [ -z "$SVC" ] && SVC="$S2"
          [ -z "$SVC" ] && SVC="$S3"
          [ -z "$SVC" ] && SVC="$S4"
          [ -z "$SVC" ] && SVC="$S5"
          if [ -z "$SVC" ]; then
            echo "::error::Nenhum secret de serviço encontrado. Crie RAILWAY_SERVICE_ID com o nome ou ID do serviço do app (não o MySQL)."
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "service=$SVC" >> "$GITHUB_OUTPUT"
          echo "Serviço resolvido: $SVC"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ steps.secrets.outputs.token }}
        run: railway up --detach --service "${{ steps.secrets.outputs.service }}"

      - name: Summary
        run: |
          echo "### Deploy enviado à Railway" >> "$GITHUB_STEP_SUMMARY"
          echo "Service: \`${{ steps.secrets.outputs.service }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
