name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'leonardoaranhaa/verificafonte'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.Railway_secret }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Secret Railway_secret ausente."
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::error::Secret RAILWAY_SERVICE_ID ausente. No Railway: serviço do app → Settings → copie o Service ID ou o nome (ex: verificafonte)."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.Railway_secret }}
        run: railway up --detach --service "${{ secrets.RAILWAY_SERVICE_ID }}"

      - name: Summary
        run: |
          echo "### Deploy enviado à Railway" >> "$GITHUB_STEP_SUMMARY"
          echo "Service: \`${{ secrets.RAILWAY_SERVICE_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
